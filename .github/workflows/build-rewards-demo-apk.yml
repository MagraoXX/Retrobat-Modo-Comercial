name: Build Rewards Companion Demo APK

on:
  push:
    branches:
      - chatgpt-apk-build
    paths:
      - 'android-demo/RewardsCompanionDemo/**'
      - '.github/workflows/build-rewards-demo-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: android-demo/RewardsCompanionDemo
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RewardsCompanionDemo-APK
          path: android-demo/RewardsCompanionDemo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
