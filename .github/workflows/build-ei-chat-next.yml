name: Build Ei Chat Next APK

on:
  push:
    branches:
      - ei-chat-opensource-rebuild
    paths:
      - 'tv-assistant-next/**'
      - '.github/workflows/build-ei-chat-next.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download sherpa-onnx Android runtime
        run: |
          mkdir -p tv-assistant-next/app/libs
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -o tv-assistant-next/app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  tv-assistant-next/app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Bundle Silero VAD model
        run: |
          mkdir -p tv-assistant-next/app/src/main/assets
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx \
            -o tv-assistant-next/app/src/main/assets/silero_vad.onnx
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  tv-assistant-next/app/src/main/assets/silero_vad.onnx" | sha256sum -c -

      - name: Build Ei Chat Next
        working-directory: tv-assistant-next
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp tv-assistant-next/app/build/outputs/apk/debug/app-debug.apk EiChat-Next-0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EiChat-Next-0.1-APK
          path: EiChat-Next-0.1.apk
          if-no-files-found: error
