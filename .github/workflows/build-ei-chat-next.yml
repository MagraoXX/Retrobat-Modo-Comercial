name: Build Ei Chat Next APK

on:
  push:
    branches:
      - ei-chat-opensource-rebuild
    paths:
      - 'tv-assistant-next/**'
      - '.github/workflows/build-ei-chat-next.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Ei Chat Next
        working-directory: tv-assistant-next
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp tv-assistant-next/app/build/outputs/apk/debug/app-debug.apk EiChat-Next-0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EiChat-Next-0.1-APK
          path: EiChat-Next-0.1.apk
          if-no-files-found: error
