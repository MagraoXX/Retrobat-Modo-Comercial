name: Build Ei Chat TV APK

on:
  push:
    branches:
      - chatgpt-tv-assistant
    paths:
      - 'tv-assistant/**'
      - '.github/workflows/build-ei-chat-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: tv-assistant
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EiChatTV-APK
          path: tv-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
