name: Build Ei Chat TV APK

on:
  push:
    branches:
      - chatgpt-tv-assistant
    paths:
      - 'tv-assistant/**'
      - '.github/workflows/build-ei-chat-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ei-chat-debug-keystore-v1
      - name: Build debug APK
        working-directory: tv-assistant
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare direct APK
        run: cp tv-assistant/app/build/outputs/apk/debug/app-debug.apk EiChat-Teste17.apk
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EiChatTV-APK
          path: EiChat-Teste17.apk
          if-no-files-found: error
      - name: Publish direct APK on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ei-chat-teste17 >/dev/null 2>&1; then
            gh release upload ei-chat-teste17 EiChat-Teste17.apk --clobber
          else
            gh release create ei-chat-teste17 EiChat-Teste17.apk --title "Ei Chat - Teste 17" --notes "Teste 17: adiciona escuta contínua da palavra de ativação 'Ei Chat'/'Chat' pelo VoiceInteractionService. Ao detectar a frase, abre o painel compacto e mantém conversa contínua até 'encerrar chamada'."
          fi
