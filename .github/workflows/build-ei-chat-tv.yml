name: Build Ei Chat TV APK

on:
  push:
    branches:
      - chatgpt-tv-assistant
      - ei-chat-teste24-dev
    paths:
      - 'tv-assistant/**'
      - '.github/workflows/build-ei-chat-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ei-chat-debug-keystore-v2
      - name: Ensure stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          echo "EI_CHAT_SIGNING_SHA256"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Build debug APK
        working-directory: tv-assistant
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare direct APK
        run: cp tv-assistant/app/build/outputs/apk/debug/app-debug.apk EiChat-Teste24.apk
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EiChatTV-APK
          path: EiChat-Teste24.apk
          if-no-files-found: error
      - name: Publish direct APK on GitHub Release
        if: github.ref == 'refs/heads/chatgpt-tv-assistant'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ei-chat-teste24 >/dev/null 2>&1; then
            gh release upload ei-chat-teste24 EiChat-Teste24.apk --clobber
          else
            gh release create ei-chat-teste24 EiChat-Teste24.apk --title "Ei Chat - Teste 24" --notes "Teste 24: interface principal refeita para uma experiência muito mais próxima do ChatGPT na TV. Adiciona histórico local persistente de conversas, contexto entre mensagens, barra lateral de chats, composer central, modo de chamada de voz em tela cheia com transcrição parcial, estados Ouvindo/Pensando/Respondendo, silenciar/encerrar e retomada automática da escuta. Mantém correções de voz e recursos do Teste 23."
          fi
