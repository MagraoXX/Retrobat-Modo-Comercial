name: Build Ei Chat TV APK

on:
  push:
    branches:
      - chatgpt-tv-assistant
    paths:
      - 'tv-assistant/**'
      - '.github/workflows/build-ei-chat-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tv-assistant
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare direct APK
        run: cp tv-assistant/app/build/outputs/apk/debug/app-debug.apk EiChat-Teste16.apk
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EiChatTV-APK
          path: EiChat-Teste16.apk
          if-no-files-found: error
      - name: Publish direct APK on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ei-chat-teste16 >/dev/null 2>&1; then
            gh release upload ei-chat-teste16 EiChat-Teste16.apk --clobber
          else
            gh release create ei-chat-teste16 EiChat-Teste16.apk --title "Ei Chat - Teste 16" --notes "Teste 16: corrige registro do VoiceInteractionService no Android TV adicionando RecognitionService obrigatório, mantendo a interface ChatGPT e o painel de voz compacto."
          fi
