plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magraoxx.eichattv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magraoxx.eichattv'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.17.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
